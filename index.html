<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>汪浩然 · AI 应用与可视化前端工程师</title>
    <meta
      name="description"
      content="汪浩然 —— 常驻天津、6 年经验的前端工程师，关注 AI 应用、交互动效与 3D 可视化。在线作品集与可打印简历。"
    />
    <meta name="theme-color" content="#0b0b0e" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="汪浩然 · AI 应用与可视化前端工程师" />
    <meta property="og:description" content="AI 应用 · 交互动效 · 3D 可视化 —— 一份可以交互的简历。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      ;(function () {
        var root = document.documentElement
        try {
          var saved = localStorage.getItem('mp-theme')
          root.dataset.theme = saved === 'light' || saved === 'dark' ? saved : 'dark'
        } catch (e) {
          root.dataset.theme = 'dark'
        }
        root.classList.add('is-loading')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        这个站点依赖 JavaScript 呈现交互动效，请启用后访问。 This site needs JavaScript for its interactive motion.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
